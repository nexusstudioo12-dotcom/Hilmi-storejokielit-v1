<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .error-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .error-title { font-size: clamp(60px, 12vw, 120px); font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="page-background"></div>
    <div class="container error-container">
        <h1 class="error-title">404</h1>
        <p style="margin-bottom: 30px; font-size: 1.2rem; color: #fff;">Halaman tidak ditemukan.</p>
        <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
    </div>
</body>
</html>
